name: onlead

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: onlead:local
    container_name: onlead-app
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      PORT: 4173
      NODE_ENV: production
      NODE_OPTIONS: --experimental-sqlite
      BACKUP_OFFSITE_DIR: /app/data/offsite
      YOOKASSA_IP_ALLOWLIST: "1"
    volumes:
      - onlead_data:/app/data
      - /opt/onlead/backups:/app/data/offsite
    networks:
      default: {}
      neiro:
        aliases: [onlead]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  neiro:
    external: true
    name: neiro-academy_neiro-net

volumes:
  onlead_data:
